name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}
      # Development follows Switchboard main; the public catalog may lag.
      - name: Install latest Switchboard package
        run: raco pkg install --auto --no-docs --name switchboard https://github.com/turinglambdaai/switchboard.git
      - name: Install package
        run: raco pkg install --auto --no-docs --name sonar "${{ github.workspace }}"
      - name: Compile
        run: raco make sonar/main.rkt sonar/switchboard.rkt sonar-doc/scribblings/sonar.scrbl examples/semantic-search.rkt
      - name: Test
        run: raco test -p sonar

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: "9.3"
      # Development follows Switchboard main; the public catalog may lag.
      - name: Install latest Switchboard package
        run: raco pkg install --auto --no-docs --name switchboard https://github.com/turinglambdaai/switchboard.git
      - name: Install package with documentation
        run: raco pkg install --auto --name sonar "${{ github.workspace }}"
      - name: Check declared package dependencies
        run: raco setup --check-pkg-deps sonar
      - name: Build reference manual
        run: raco scribble --htmls --dest "${{ runner.temp }}/sonar-doc" sonar-doc/scribblings/sonar.scrbl
      - name: Run offline walkthrough
        run: racket examples/semantic-search.rkt
      - name: Require a clean generated tree
        run: git diff --exit-code
